
services:
    app-1:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            REDIS_HOST: redis
            SESSION_DRIVER: redis
            CACHE_STORE: redis
        volumes:
            - laravel_storage:/var/www/html/storage
            - app1_cache:/var/www/html/bootstrap/cache
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - '$$s=@fsockopen("127.0.0.1",9000);exit($$s?0:1);'
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - backend

    app-2:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: mysql
            REDIS_HOST: redis
            SESSION_DRIVER: redis
            CACHE_STORE: redis
        volumes:
            - laravel_storage:/var/www/html/storage
            - app2_cache:/var/www/html/bootstrap/cache
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - '$$s=@fsockopen("127.0.0.1",9000);exit($$s?0:1);'
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - backend

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - laravel_storage:/var/www/html/storage:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app-1:
                condition: service_healthy
            app-2:
                condition: service_healthy
        networks:
            - frontend
            - backend

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                - CMD-SHELL
                - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s
        networks:
            - backend

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
        command:
            - sh
            - -c
            - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                - CMD-SHELL
                - 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG'
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend

volumes:
    mysql_data:
    redis_data:
    laravel_storage:
    app1_cache:
    app2_cache:

networks:
    frontend:
    backend:
        internal: true
