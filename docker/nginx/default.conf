upstream laravel {
    least_conn;
    server app-1:9000 max_fails=3 fail_timeout=30s;
    server app-2:9000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass laravel;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Do not execute arbitrary PHP files from public directories.
    location ~ \.php$ {
        return 404;
    }

    # Block hidden files, except ACME challenge paths.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
