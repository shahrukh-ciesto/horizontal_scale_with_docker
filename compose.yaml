services:

  app-1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    volumes:
      - ./:/var/www/html

    depends_on:
      - mysql
      - redis

  app-2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    volumes:
      - ./:/var/www/html

    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app-1
      - app-2

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: